name: One-time verify Missing Music 1.8.0 final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-verify-missing-music-1.8.0-final.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Remove verification workflow
        run: |
          git rm .github/workflows/one-time-verify-missing-music-1.8.0-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Missing Music 1.8.0 final verification workflow"
          git push origin HEAD:main